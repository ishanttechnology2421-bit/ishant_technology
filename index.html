<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>व्यक्ति पंजीकरण पोर्टल - ISHANT Technology</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }

        body { background: #f0f4ff; color: #333; }

        .topbar {
            background: linear-gradient(90deg, #1565c0, #1e88e5);
            color: #fff;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-circle {
            width: 36px; height: 36px; border-radius: 50%;
            background: #fff; color: #1565c0;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold;
        }

        .page { max-width: 960px; margin: 16px auto 40px; padding: 0 12px; }

        .card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            padding: 16px;
            margin-top: 8px;
        }

        .card h2 { font-size: 20px; margin-bottom: 8px; }

        .info-box {
            background: #fff8e1;
            border-left: 4px solid #ffb300;
            padding: 10px 12px;
            font-size: 13px;
            margin-bottom: 12px;
        }

        form label { display: block; margin: 8px 0 4px; font-size: 14px; }

        form input, form select, form textarea {
            width: 100%; padding: 8px;
            border-radius: 6px; border: 1px solid #c5cae9;
            font-size: 14px;
        }

        .form-row { display: flex; flex-wrap: wrap; gap: 10px; }

        .form-group { flex: 1; min-width: 180px; }

        .btn {
            background: #1976d2; color: #fff;
            border: none; padding: 10px 18px;
            border-radius: 20px; cursor: pointer; font-size: 14px;
            margin-top: 12px;
        }

        .btn-tab {
            border-radius: 20px;
            border: 1px solid #1565c0;
            background: #e3f2fd;
            color: #1565c0;
            padding: 8px 14px;
            font-size: 14px;
            cursor: pointer;
        }

        .btn-tab.active {
            background: #1565c0;
            color: #fff;
        }

        .wa-btn {
            display:block;
            margin-top:12px;
            background:#25D366;
            color:#fff;
            padding:10px 18px;
            text-align:center;
            border-radius:20px;
            text-decoration:none;
            font-size:14px;
            cursor:pointer;
        }

        .wa-btn.loading { opacity: 0.7; }

        .error-text {
            color: red;
            font-size: 12px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 13px;
        }

        th, td {
            border: 1px solid #cfd8dc;
            padding: 6px 8px;
            text-align: left;
        }

        th { background: #e3f2fd; }

        tbody tr:nth-child(even) {
            background: #f5f5f5;
        }

        .small {
            font-size: 12px;
            color: #555;
        }

        .tabs-row {
            display:flex;
            gap:10px;
            margin-top:12px;
            margin-bottom:4px;
            flex-wrap:wrap;
        }
    </style>
</head>

<body>

    <div class="topbar">
        <div class="logo-circle">IT</div>
        <div>यह पोर्टल इशांत टेक्नोलॉजी की तरफ से दिया जा रहा है।</div>
    </div>

    <div class="page">

        <!-- Tabs -->
        <div class="tabs-row">
            <button id="tabForm" class="btn-tab active" onclick="showSection('formSection')">व्यक्ति पंजीकरण</button>
            <button id="tabList" class="btn-tab" onclick="showSection('listSection')">पंजीकरण की सूची</button>
        </div>

        <div id="formSection" style="display:block;">
            <div class="card">
                <h2>व्यक्ति पंजीकरण फ़ॉर्म</h2>

                <div class="info-box">
                    <b>सूचना :</b> पंजीकरण के बाद जल्द ही संपर्क किया जाएगा।
                </div>

                <form id="vyaktiForm">

                    <div class="form-row">
                        <div class="form-group">
                            <label>व्यक्ति का नाम *</label>
                            <input type="text" id="workerName" required>
                        </div>

                        <div class="form-group">
                            <label>जन्म तिथि *</label>
                            <input type="date" id="dob" required>
                        </div>

                        <div class="form-group">
                            <label>आधार नंबर *</label>
                            <input type="text" id="aadhaar" maxlength="12"
                                oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,12);" required>
                            <small id="aadhaarMsg" class="error-text"></small>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>मोबाइल नंबर *</label>
                            <input type="tel" id="mobile" maxlength="10"
                                oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,10);" required>
                            <small id="mobileMsg" class="error-text"></small>
                        </div>

                        <div class="form-group">
                            <label>तहसील *</label>
                            <select id="tehsil" required>
                                <option value="">तहसील चुनें</option>
                                <option>नवाबगंज</option>
                                <option>फतेहपुर</option>
                                <option>रामसनेहीघाट</option>
                                <option>हैदरगढ़</option>
                                <option>रामनगर</option>
                                <option>सिरौली</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>ब्लॉक *</label>
                            <select id="block" required>
                                <option value="">ब्लॉक चुनें</option>
                                <option>बंकी</option>
                                <option>मसौली</option>
                                <option>देवा</option>
                                <option>हरख</option>
                                <option>फतेहपुर</option>
                                <option>हैदरगढ़</option>
                                <option>दरियाबाद</option>
                                <option>सूरतगंज</option>
                                <option>सिद्धौर</option>
                                <option>पूरे डलई</option>
                                <option>निन्दूरा</option>
                                <option>त्रिवेदीगंज</option>
                                <option>रामनगर</option>
                                <option>सिरौली ग़ौसपुर</option>
                                <option>बनीकोडर</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>पिन कोड *</label>
                            <input type="text" id="pincode" maxlength="6"
                                oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,6);" required>
                        </div>

                        <div class="form-group">
                            <label>पोस्ट *</label>
                            <input type="text" id="post" required>
                        </div>

                        <div class="form-group">
                            <label>पंचायत *</label>
                            <input type="text" id="panchayat" required>
                        </div>

                        <div class="form-group" style="flex:2;">
                            <label>पूरा पता *</label>
                            <textarea id="address" rows="3" required></textarea>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>आवेदक का नाम *</label>
                            <input type="text" id="applicantName" required>
                        </div>

                        <div class="form-group">
                            <label>आवेदक मोबाइल नंबर *</label>
                            <input type="tel" id="applicantMobile" maxlength="10"
                                oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,10);" required>
                        </div>
                    </div>

                    <button class="btn" type="submit">पंजीकरण सबमिट करें</button>

                    <a id="wa1" class="wa-btn">WhatsApp पर भेजें (9454238343)</a>
                    <a id="wa2" class="wa-btn">WhatsApp पर भेजें (9569615494)</a>

                </form>
            </div>
        </div>

        <div id="listSection" style="display:none;">
            <div class="card">
                <h2>पंजीकरण की सूची</h2>

                <button class="btn" onclick="loadListFromSheet()">लिस्ट लोड करें</button>

                <div style="overflow-x:auto;">
                    <table id="listTable">
                        <thead>
                            <tr>
                                <th>क्रम सं.</th>
                                <th>व्यक्ति नाम</th>
                                <th>DOB</th>
                                <th>आधार</th>
                                <th>मोबाइल</th>
                                <th>पता</th>
                                <th>आवेदक नाम</th>
                                <th>आवेदक मोबाइल</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>

            </div>
        </div>

    </div> <!-- page -->

<script>
function showSection(sectionId) {
    formSection.style.display = "none";
    listSection.style.display = "none";
    document.getElementById(sectionId).style.display = "block";

    tabForm.classList.remove("active");
    tabList.classList.remove("active");
    if (sectionId === "formSection") tabForm.classList.add("active");
    else tabList.classList.add("active");
}

function getSavedRecords() {
    return JSON.parse(localStorage.getItem("savedRecords") || "[]");
}

function saveRecord(aadhaar, mobile) {
    const r = getSavedRecords();
    r.push({ aadhaar, mobile });
    localStorage.setItem("savedRecords", JSON.stringify(r));
}

function checkDuplicateAadhaar() {
    const value = aadhaar.value;
    aadhaarMsg.textContent = "";
    if (value.length < 12) return false;
    const exists = getSavedRecords().some(r => r.aadhaar === value);
    if (exists) aadhaarMsg.textContent = "❌ यह आधार पहले से मौजूद है!";
    return exists;
}

function checkDuplicateMobile() {
    const value = mobile.value;
    mobileMsg.textContent = "";
    if (value.length < 10) return false;
    const exists = getSavedRecords().some(r => r.mobile === value);
    if (exists) mobileMsg.textContent = "❌ यह मोबाइल पहले से मौजूद है!";
    return exists;
}

aadhaar.addEventListener("input", checkDuplicateAadhaar);
mobile.addEventListener("input", checkDuplicateMobile);

vyaktiForm.addEventListener("submit", e => {
    e.preventDefault();

    if (checkDuplicateAadhaar() || checkDuplicateMobile()) {
        alert("❌ आधार/मोबाइल पहले से मौजूद है!");
        return;
    }

    saveRecord(aadhaar.value, mobile.value);
    alert("✅ डेटा सेव हो गया।");
});

function getFormData() {
    return (
        "*व्यक्ति पंजीकरण विवरण*\n\n" +
        "👤 नाम: " + workerName.value + "\n" +
        "📅 DOB: " + dob.value + "\n" +
        "🪪 आधार: " + aadhaar.value + "\n" +
        "📱 मोबाइल: " + mobile.value + "\n" +
        "🏢 तहसील: " + tehsil.value + "\n" +
        "🏘 ब्लॉक: " + block.value + "\n" +
        "📮 पिन: " + pincode.value + "\n" +
        "🏤 पोस्ट: " + post.value + "\n" +
        "🌐 पंचायत: " + panchayat.value + "\n" +
        "📍 पता: " + address.value + "\n\n" +
        "🙋 आवेदक: " + applicantName.value + "\n" +
        "📞 आवेदक मोबाइल: " + applicantMobile.value
    );
}

wa1.onclick = () => {
    window.open("https://wa.me/919454238343?text=" + encodeURIComponent(getFormData()));
};

wa2.onclick = () => {
    window.open("https://wa.me/919569615494?text=" + encodeURIComponent(getFormData()));
};

/* ------------------------------------
   GOOGLE SHEET CSV LINK (ADDED)
------------------------------------ */

const SHEET_CSV_URL =
 "https://docs.google.com/spreadsheets/d/1qeCjwvVkc0CKnK6Cxc6BHPkx8Ga99gyIwYxIOWXzfvU/export?format=csv";

function loadListFromSheet() {
    fetch(SHEET_CSV_URL)
        .then(res => res.text())
        .then(csv => {
            const rows = csv.trim().split("\n");
            const tbody = document.querySelector("#listTable tbody");
            tbody.innerHTML = "";

            for (let i = 1; i < rows.length; i++) {
                const cols = rows[i].split(",");

                if (cols.length < 7) continue;

                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>${i}</td>
                    <td>${cols[0]}</td>
                    <td>${cols[1]}</td>
                    <td>${cols[2]}</td>
                    <td>${cols[3]}</td>
                    <td>${cols[4]}</td>
                    <td>${cols[5]}</td>
                    <td>${cols[6]}</td>
                `;
                tbody.appendChild(tr);
            }
        })
        .catch(err => {
            alert("लिस्ट लोड नहीं हो पाई।");
            console.log(err);
        });
}
</script>

</body>
                    </html>
